# FER kinematic controller. Task/priority/action syntax follows kcl_undroid.conf.
loopRate = 100.0; # Hz
linearErrorThreshold = 0.002; # m
angularErrorThreshold = 0.01; # rad
jointErrorThreshold = 0.01; # rad
feedbackTimeout = 0.20;
velocityCommandTimeout = 0.30;
moveTimeout = 30.0;
enableTimeout = 5.0;
jointLimitMargin = 0.05;
actionTransitionDuration = 0.15; # seconds

saturationMin = [-0.35, -0.35, -0.35, -0.35, -0.35, -0.35, -0.35];
saturationMax = [0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35];
parkedJointsPos = [0.0, -0.4, 0.0, -2.7, 0.0, 2.3, 0.7853981633974483];
unparkedJointsPos = [0.0, -0.7853981633974483, 0.0, -2.356194490192345, 0.0, 1.5707963267948966, 0.7853981633974483];

# Plane equation in the Panda base: normal.dot(point) + offset = 0.
obstacles: (
    { name = "Table"; normal = [0.0, 0.0, 1.0]; offset = -0.10; }
);

# States select an action by name. Actions select priority levels below.
states: {
    idle: { action = "Idle"; }
    parking: { action = "ParkUnpark"; }
    unparking: { action = "ParkUnpark"; }
    move_joints_pos: { action = "MoveJointsPosition"; }
    move_joints_vel: { action = "MoveJointsVelocity"; }
    move_cartesian: { action = "MoveTool"; }
}

# type: 0 = equality, 1 = inequality. Gains and saturations belong to each task.
# The legacy spellings of IKCL activation parameters are kept for compatibility.
tasks: {
    JointsLimit: {
        type = 1;
        gain = 0.02;
        enable = true;
        saturation = 0.5;
        activationStartDistanceGreaterThanParams = [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15];
        activationStartDistanceLessThanParams = [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15];
        activationIntervaLengthGreaterThanParams = [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10];
        activationIntervaLengthLessThanParams = [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10];
    }
    ObstacleAvoidance: {
        type = 1;
        gain = 0.5;
        enable = true;
        saturation = 0.5;
        greaterThanParams: {
            xmin = [0.00];
            xmax = [0.10];
        }
    }
    JointsPosition: {
        type = 0;
        gain = 1.0;
        enable = true;
        saturation = 0.2;
    }
    JointsVelocity: {
        type = 0;
        gain = 1.0;
        enable = true;
        saturation = 0.2;
    }
    ToolCartesianDistance: {
        type = 0;
        gain = 0.5;
        enable = true;
        saturation = 0.6;
        useVirtualFrame = false;
    }
    ToolCartesianOrientation: {
        type = 0;
        gain = 0.4;
        enable = true;
        saturation = 10.0;
        useVirtualFrame = false;
    }
    JointsPosture: {
        type = 0;
        gain = 0.1;
        enable = true;
        saturation = 0.1;
    }
}

# Earlier entries have higher priority in TPIK's unified hierarchy.
priorityLevels: (
    { name = "PL_Safety";
      tasks = ["JointsLimit", "ObstacleAvoidance"];
      lambda = 0.0001;
      threshold = 0.01; },
    { name = "PL_MoveJointsPosition";
      tasks = ["JointsPosition"];
      lambda = 0.0001;
      threshold = 0.01; },
    { name = "PL_MoveJointsVelocity";
      tasks = ["JointsVelocity"];
      lambda = 0.0001;
      threshold = 0.01; },
    { name = "PL_MoveTool";
      tasks = ["ToolCartesianDistance", "ToolCartesianOrientation"];
      lambda = 0.0001;
      threshold = 0.01; },
    { name = "PL_Posture";
      tasks = ["JointsPosture"];
      lambda = 0.0001;
      threshold = 0.01; }
);

actions: (
    { name = "Idle";
      levels = ["PL_Safety"]; },
    { name = "ParkUnpark";
      levels = ["PL_Safety", "PL_MoveJointsPosition"]; },
    { name = "MoveJointsPosition";
      levels = ["PL_Safety", "PL_MoveJointsPosition"]; },
    { name = "MoveJointsVelocity";
      levels = ["PL_Safety", "PL_MoveJointsVelocity"]; },
    { name = "MoveTool";
      levels = ["PL_Safety", "PL_MoveTool", "PL_Posture"]; }
);
