# Dynamic joint controller, executed with current libfranka model data at 1 kHz.
controlMode = "ComputedTorque"; # "ComputedTorque" or "JointImpedance"
loopRate = 500.0;               # ROS reference generator, Hz
feedbackTimeout = 0.20;
commandTimeout = 0.20;

maxJointVelocity = 0.35;        # rad/s
maxJointAcceleration = 0.6;     # rad/s^2
maxJointJerk = 5.0;             # rad/s^3
referenceVelocityGain = 20.0;
maxTrackingError = 0.10;        # rad, bounds reference integration error
jointLimitMargin = 0.05;        # rad

# ComputedTorque: acceleration feedback gains; JointImpedance: stiffness/damping.
positionGain = [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0];
velocityGain = [12.0, 12.0, 12.0, 12.0, 12.0, 12.0, 12.0];
torqueLimit = [30.0, 30.0, 30.0, 30.0, 8.0, 8.0, 8.0]; # Nm, excludes gravity
torqueRateLimit = [200.0, 200.0, 200.0, 200.0, 200.0, 200.0, 200.0]; # Nm/s
